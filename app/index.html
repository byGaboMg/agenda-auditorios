<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Auditorios</title>
<meta name="description" content="Agenda colaborativa del Departamento de Auditorios, Dirección de Difusión Cultural IPN.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../vistas/logo_claro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Aplica el tema guardado antes de pintar para evitar parpadeo.
  try { var t = localStorage.getItem('agenda-tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t === 'oscuro' ? 'dark' : 'light'; } catch (e) {}
</script>
</head>
<body>
<div id="app"><div class="boot">Cargando…</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
